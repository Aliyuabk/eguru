name: election_monitor_app
description: A comprehensive election monitoring mobile application with professional UI/UX
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Design
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  smooth_page_indicator: ^1.1.0
  
  # State Management
  provider: ^6.0.5
  
  # Networking
  dio: ^5.3.2
  
  # JSON Serialization
  json_annotation: ^4.8.1
  
  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Location & Maps
  geolocator: ^10.1.0
  
  # Camera & Media
  image_picker: ^1.0.4
  file_picker: ^5.5.0
  video_player: ^2.7.2
  
  # Utilities
  intl: ^0.18.1
  connectivity_plus: ^5.0.1
  permission_handler: ^11.0.1
  package_info_plus: ^4.2.0
  url_launcher: ^6.2.1
  
  # UI Components
  fluttertoast: ^8.2.2
  cached_network_image: ^3.3.0
  photo_view: ^0.14.0
  flutter_rating_bar: ^4.0.1
  pull_to_refresh: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/