name: election_monitor_app
description: A comprehensive election monitoring mobile application with professional UI/UX
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  flutter_svg: ^2.2.0
  google_fonts: ^6.3.0
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  smooth_page_indicator: ^1.2.1

  # State Management
  provider: ^6.1.5

  # Networking
  dio: ^5.9.0

  # JSON Serialization
  json_annotation: ^4.9.0

  # Local Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Location
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  location: ^8.0.1

  # Camera & Media
  image_picker: ^1.2.0
  file_picker: ^10.3.3
  video_player: ^2.10.0

  # Utilities
  intl: ^0.20.2
  connectivity_plus: ^7.0.0
  permission_handler: ^12.0.1
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2

  # UI Components
  fluttertoast: ^8.2.14
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  flutter_rating_bar: ^4.0.1
  pull_to_refresh: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.7.1
  json_serializable: ^6.11.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/