name: election_monitor_app
description: A comprehensive election monitoring mobile application with professional UI/UX
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ============================================================
  # CORE ESSENTIALS
  # ============================================================
  provider: ^6.1.5
  dio: ^5.9.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  permission_handler: ^12.0.1
  intl: ^0.20.2
  connectivity_plus: ^7.0.0
  url_launcher: ^6.3.2
  json_annotation: ^4.9.0
  package_info_plus: ^9.0.0

  # ============================================================
  # UI & DESIGN
  # ============================================================
  google_fonts: ^6.3.0
  flutter_svg: ^2.2.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fluttertoast: ^8.2.14
  flutter_staggered_animations: ^1.1.1
  smooth_page_indicator: ^1.2.1
  photo_view: ^0.15.0
  badges: ^3.1.2

  # ============================================================
  # MEDIA & CAMERA
  # ============================================================
  image_picker: ^1.2.0
  file_picker: ^10.3.3
  video_player: ^2.10.0

  # ============================================================
  # LOCATION
  # ============================================================
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  location: ^8.0.1

  # ============================================================
  # OTHER UTILITIES
  # ============================================================
  flutter_rating_bar: ^4.0.1
  pull_to_refresh: ^2.0.0
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.7.1
  json_serializable: ^6.11.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Comment out assets if folders don't exist yet
  # assets:
  #   - assets/images/
  #   - assets/icons/
  #   - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo.png"
  min_sdk_android: 21