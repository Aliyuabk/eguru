name: election_guru
description: "Election Management System Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Utilities
  provider: ^6.1.1
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  
  # Networking
  http: ^1.2.1
  connectivity_plus: ^5.0.2
  
  # Location & Maps
  geolocator: ^10.1.0
  
  # Camera & Media
  image_picker: ^1.0.7
  
  # Storage
  path_provider: ^2.1.2
  
  # Biometrics
  local_auth: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/